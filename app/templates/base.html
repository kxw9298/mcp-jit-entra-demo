<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JIT approvals{% endblock %} · JIT MCP</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
    --accent: #1f4fd1; --ok: #18794e; --ok-bg: #e6f4ec; --warn: #9a5b00; --warn-bg: #fdf1dc;
    --bad: #b42318; --bad-bg: #fde8e6; --idle: #55554f; --idle-bg: #eeede8;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
      --accent: #7aa2ff; --ok: #5fd39a; --ok-bg: #16352a; --warn: #f0b45a; --warn-bg: #3a2c12;
      --bad: #ff8a80; --bad-bg: #3d1a17; --idle: #c9c8c1; --idle-bg: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
  .brand { font-weight: 650; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--muted); font-weight: 400; }
  .who { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .who a { color: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 32px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  dl.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; word-break: break-word; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  .args { font-family: var(--mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; display: inline-block; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .s-pending { color: var(--warn); background: var(--warn-bg); }
  .s-approved { color: var(--ok); background: var(--ok-bg); }
  .s-denied, .s-revoked { color: var(--bad); background: var(--bad-bg); }
  .s-expired, .s-used { color: var(--idle); background: var(--idle-bg); }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  .note { border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
  .note.info { background: var(--idle-bg); }
  .note.ok { background: var(--ok-bg); color: var(--ok); }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--accent); }
  .empty { color: var(--muted); padding: 14px; background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
  .muted { color: var(--muted); }
  form { display: inline; }
  @media (max-width: 640px) { dl.kv { grid-template-columns: 1fr; } dl.kv dt { margin-top: 6px; } .who { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/jit">JIT MCP <span>· approvals</span></a>
    {% if user %}
    <div class="who">Signed in as <strong>{{ user.name }}</strong> {{ user.username }} · <a href="/auth/logout">Sign out</a></div>
    {% endif %}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
